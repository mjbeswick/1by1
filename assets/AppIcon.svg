<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa6ff"/>
      <stop offset="1" stop-color="#0a5ccf"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4efff"/>
      <stop offset="1" stop-color="#c3d9f7"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#04224d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS-style rounded square with the app's accent blue -->
  <rect x="44" y="44" width="936" height="936" rx="214" fill="url(#bg)"/>
  <rect x="44" y="44" width="936" height="936" rx="214" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <g filter="url(#shadow)">
    <!-- folder: tab and back -->
    <path d="M226 316 C226 290 247 270 273 270 H446 C461 270 475 277 484 289 L520 336 H751 C777 336 798 357 798 383 V704 C798 735 773 760 742 760 H282 C251 760 226 735 226 704 Z" fill="url(#back)"/>
    <!-- folder: front plate -->
    <path d="M226 408 C226 382 247 362 273 362 H751 C777 362 798 382 798 408 V704 C798 735 773 760 742 760 H282 C251 760 226 735 226 704 Z" fill="url(#front)"/>
  </g>

  <!-- track list inside the folder: the first row is selected and playing -->
  <rect x="264" y="446" width="496" height="52" rx="14" fill="#0a84ff"/>
  <path d="M290 466 C290 460 296 457 301 460 L321 472 C325 474 325 480 321 482 L301 494 C296 497 290 494 290 488 Z" fill="#ffffff"/>
  <rect x="344" y="466" width="300" height="12" rx="6" fill="#ffffff"/>
  <rect x="264" y="520" width="496" height="52" rx="14" fill="#dbe8fb"/>
  <rect x="304" y="540" width="330" height="12" rx="6" fill="#8fb1e3"/>
  <rect x="264" y="594" width="496" height="52" rx="14" fill="#dbe8fb"/>
  <rect x="304" y="614" width="270" height="12" rx="6" fill="#8fb1e3"/>
</svg>
