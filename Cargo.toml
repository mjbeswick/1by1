[package]
name = "onebyone"
version = "0.1.0"
edition = "2024"

[dependencies]
fltk = { version = "1.5.23", features = ["enable-glwindow"] }
lofty = "0.25"
openmpt = "0.3.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
trash = "5.2.9"
